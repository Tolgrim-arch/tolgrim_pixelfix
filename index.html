<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelFix — AI Pixel Art Repair</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
      </svg>
      <span>PixelFix</span>
      <span class="badge" id="dimensions-badge">Sin imagen</span>
    </div>

    <div class="actions">
      <div class="history-controls">
        <button id="undo-btn" class="icon-btn" title="Deshacer (Ctrl+Z)" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 14 4 9 9 4" />
            <path d="M20 20v-7a4 4 0 0 0-4-4H4" />
          </svg>
        </button>
        <button id="redo-btn" class="icon-btn" title="Rehacer (Ctrl+Y / Ctrl+Shift+Z)" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 14 20 9 15 4" />
            <path d="M4 20v-7a4 4 0 0 1 4-4h12" />
          </svg>
        </button>
      </div>

      <label class="btn btn-secondary" for="file-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        Cargar Imagen
      </label>
      <input id="file-input" type="file" accept="image/*" hidden />

      <div class="export-group">
        <select id="export-scale" aria-label="Escala de exportación">
          <option value="1">1x (Nativo 1:1)</option>
          <option value="2">2x</option>
          <option value="4" selected>4x</option>
          <option value="8">8x</option>
          <option value="16">16x</option>
        </select>
        <button id="export-btn" class="btn btn-primary" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Exportar PNG
        </button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="viewport-area" id="viewport-area">
      <div class="viewport-toolbar">
        <div class="toolbar-left">
          <div class="view-toggle" role="group" aria-label="Modo de vista">
            <button class="toggle-btn active" data-view="fixed">Arreglado</button>
            <button class="toggle-btn" data-view="original">Original + Grilla</button>
          </div>
          <div class="crop-controls">
            <button id="crop-btn" class="icon-btn" title="Recortar imagen" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 2v14a2 2 0 0 0 2 2h14" />
                <path d="M18 22V8a2 2 0 0 0-2-2H2" />
              </svg>
              <span>Recortar</span>
            </button>
            <button id="crop-apply-btn" class="btn btn-primary btn-xs hidden" disabled>Aplicar</button>
            <button id="crop-cancel-btn" class="btn btn-xs hidden">Cancelar</button>
            <button id="crop-reset-btn" class="icon-btn hidden" title="Restaurar recorte">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
              </svg>
            </button>
          </div>
        </div>

        <div class="zoom-controls">
          <button id="zoom-out" class="icon-btn" title="Alejar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" />
            </svg>
          </button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in" class="icon-btn" title="Acercar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="11" y1="8" x2="11" y2="14" /><line x1="8" y1="11" x2="14" y2="11" />
            </svg>
          </button>
          <button id="zoom-fit" class="icon-btn" title="Ajustar a pantalla">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
            </svg>
          </button>
        </div>
      </div>

      <div class="canvas-stage" id="canvas-stage">
        <canvas id="preview-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
        <div class="empty-state" id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
          <p>Arrastra una imagen aquí o haz clic en <strong>Cargar Imagen</strong></p>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-header">
          <h2>1. Grilla</h2>
          <div class="panel-actions">
            <button id="sync-cell-btn" class="icon-btn active" title="Sincronizar ancho y alto de celda">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
            </button>
            <button id="auto-grid-btn" class="btn btn-xs" disabled>Auto-detectar</button>
          </div>
        </div>
        <div class="control-row">
          <label for="cell-w">Ancho de celda <span id="cell-w-val">8</span>px</label>
          <div class="slider-group">
            <button class="step-btn" data-target="cell-w" data-delta="-0.05" aria-label="Disminuir ancho">-</button>
            <input id="cell-w" type="range" min="1" max="64" step="0.05" value="8" />
            <button class="step-btn" data-target="cell-w" data-delta="0.05" aria-label="Aumentar ancho">+</button>
          </div>
        </div>
        <div class="control-row">
          <label for="cell-h">Alto de celda <span id="cell-h-val">8</span>px</label>
          <div class="slider-group">
            <button class="step-btn" data-target="cell-h" data-delta="-0.05" aria-label="Disminuir alto">-</button>
            <input id="cell-h" type="range" min="1" max="64" step="0.05" value="8" />
            <button class="step-btn" data-target="cell-h" data-delta="0.05" aria-label="Aumentar alto">+</button>
          </div>
        </div>
        <div class="control-row">
          <label for="offset-x">Offset X <span id="offset-x-val">0</span>px</label>
          <div class="slider-group">
            <button class="step-btn" data-target="offset-x" data-delta="-0.5" aria-label="Disminuir offset X">-</button>
            <input id="offset-x" type="range" min="0" max="64" step="0.5" value="0" />
            <button class="step-btn" data-target="offset-x" data-delta="0.5" aria-label="Aumentar offset X">+</button>
          </div>
        </div>
        <div class="control-row">
          <label for="offset-y">Offset Y <span id="offset-y-val">0</span>px</label>
          <div class="slider-group">
            <button class="step-btn" data-target="offset-y" data-delta="-0.5" aria-label="Disminuir offset Y">-</button>
            <input id="offset-y" type="range" min="0" max="64" step="0.5" value="0" />
            <button class="step-btn" data-target="offset-y" data-delta="0.5" aria-label="Aumentar offset Y">+</button>
          </div>
        </div>
        <label class="checkbox-row">
          <input id="show-grid" type="checkbox" checked />
          <span>Mostrar grilla</span>
        </label>
      </div>

      <div class="panel">
        <h2>2. Muestreo</h2>
        <select id="sampling-mode">
          <option value="dominant" selected>Color Dominante (Moda)</option>
          <option value="center">Centroide (Píxel Central)</option>
          <option value="median">Mediana</option>
        </select>
      </div>

      <div class="panel">
        <h2>3. Limpieza y Fondo</h2>
        <div class="control-row">
          <label for="alpha-threshold">Umbral Alfa <span id="alpha-threshold-val">128</span></label>
          <div class="slider-group">
            <button class="step-btn" data-target="alpha-threshold" data-delta="-1" aria-label="Disminuir umbral alfa">-</button>
            <input id="alpha-threshold" type="range" min="0" max="255" step="1" value="128" />
            <button class="step-btn" data-target="alpha-threshold" data-delta="1" aria-label="Aumentar umbral alfa">+</button>
          </div>
        </div>
        <div class="chroma-row">
          <button id="eyedropper-btn" class="btn btn-secondary btn-sm" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 22l1-1h3l9-9" /><path d="M3 21v-3l9-9" /><path d="M15 6l3-3 3 3-3 3" /><path d="M12 9l3 3" />
            </svg>
            Gotero Fondo
          </button>
          <button id="clear-chroma-btn" class="btn btn-xs" disabled>Limpiar</button>
          <span class="swatch" id="chroma-swatch" title="Sin color seleccionado"></span>
        </div>
        <div class="control-row">
          <label for="chroma-tol">Tolerancia Fondo <span id="chroma-tol-val">24</span></label>
          <div class="slider-group">
            <button class="step-btn" data-target="chroma-tol" data-delta="-1" aria-label="Disminuir tolerancia">-</button>
            <input id="chroma-tol" type="range" min="0" max="120" step="1" value="24" />
            <button class="step-btn" data-target="chroma-tol" data-delta="1" aria-label="Aumentar tolerancia">+</button>
          </div>
        </div>

        <hr class="divider" />

        <label class="checkbox-row">
          <input id="remove-orphans" type="checkbox" />
          <span>Eliminar puntos huérfanos</span>
        </label>
        <label class="checkbox-row">
          <input id="black-outlines" type="checkbox" />
          <span>Detectar contornos negros</span>
        </label>
        <div class="control-row">
          <label for="black-threshold">Umbral oscuro <span id="black-threshold-val">55</span></label>
          <div class="slider-group">
            <button class="step-btn" data-target="black-threshold" data-delta="-1" aria-label="Disminuir umbral oscuro">-</button>
            <input id="black-threshold" type="range" min="10" max="120" step="1" value="55" />
            <button class="step-btn" data-target="black-threshold" data-delta="1" aria-label="Aumentar umbral oscuro">+</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>4. Paleta</h2>
        <div class="control-row">
          <label for="palette-size">Colores máx. <span id="palette-size-val">Sin límite</span></label>
          <div class="slider-group">
            <button class="step-btn" data-target="palette-size" data-delta="-2" aria-label="Disminuir colores">-</button>
            <input id="palette-size" type="range" min="0" max="64" step="2" value="0" />
            <button class="step-btn" data-target="palette-size" data-delta="2" aria-label="Aumentar colores">+</button>
          </div>
        </div>
        <div class="palette-grid" id="palette-grid"></div>
      </div>
    </aside>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
